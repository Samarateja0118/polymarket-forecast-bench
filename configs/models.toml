# Model configurations under test.
#
# CONTAMINATION CONTROL — read this before changing anything here.
#
# A forecast is only scientifically meaningful if the model could not have
# memorised the answer. The filter in eligibility.py requires
#
#     market.end_date > effective_cutoff(model)
#
# so `effective_cutoff` is the single most load-bearing number in this repo.
# Getting it wrong silently converts the whole benchmark into a memory test.
#
# `cutoff_basis` records HOW we know it, because "I asked the model" is not
# evidence — models routinely misreport their own cutoff:
#
#   documented              A date published by Anthropic. Put the URL in
#                           `cutoff_source`. Preferred.
#   release_date            The model's public release date. Always a SAFE
#                           over-estimate: training cutoff necessarily precedes
#                           release. Use when the cutoff isn't published.
#   first_observed          Auto-probed: the UTC date on which this harness
#                           first successfully called the model, recorded in the
#                           `model_observations` table. Also a safe
#                           over-estimate (you cannot call a model before it
#                           ships) and requires no outside knowledge, but it
#                           over-estimates by however long the model has been
#                           out, which throws away eligible markets.
#
# Over-estimating the cutoff costs you sample size. Under-estimating it
# invalidates your results. When in doubt, over-estimate.

[[model]]
name              = "opus5-high"
model_id          = "claude-opus-5"
effort            = "high"
thinking          = "adaptive"
supports_temperature = false     # 400 on Opus 5 — sampling params were removed
web_search        = false
effective_cutoff  = "first_observed"
cutoff_basis      = "first_observed"
cutoff_source     = "auto-probed; replace with a documented date to recover sample size"
price_in_per_mtok  = 5.00
price_out_per_mtok = 25.00

[[model]]
name              = "opus5-low"
model_id          = "claude-opus-5"
effort            = "low"
thinking          = "adaptive"
supports_temperature = false
web_search        = false
effective_cutoff  = "first_observed"
cutoff_basis      = "first_observed"
cutoff_source     = "auto-probed"
price_in_per_mtok  = 5.00
price_out_per_mtok = 25.00

