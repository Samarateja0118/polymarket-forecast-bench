[project]
name = "pmbench"
version = "0.1.0"
description = "A self-labeling forecasting benchmark for LLMs, built on Polymarket resolutions."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.0",
  "httpx>=0.27",
  "pydantic>=2.0",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pmbench = "pmbench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
